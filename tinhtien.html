<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính tiền</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 0px;
            text-align: center;
        }
        th{
            padding-top: 15px;
        }
        tbody tr {
            border-bottom: 1px dashed #ccc;
        }
        input[type="text"], input[type="number"] {
            width: 80%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .add-row, .delete-row {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
        }
        .delete-row {
            margin-left: 10px;
            margin-top: 0px;

            background-color: #f44336;
        }
        .total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .export {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Tính tiền</h1>
    <button class="add-row" onclick="addRow()">+</button>
    <table id="table">
        <thead>
            <tr>
                <th></th>
                <th>Loại</th>
                <th>Số kí</th>
                <th>Giá</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><button class="delete-row" onclick="deleteRow(this)">-</button></td>
                <td><input type="text" name="loai"></td>
                <td><input type="number" name="so_ki" oninput="calculateRow(this)"></td>
                <td><input type="number" name="gia" oninput="calculateRow(this)"></td>
                <td class="thanh_tien">0</td>
            </tr>
        </tbody>
    </table>
    <div class="total">Tổng thành tiền: <span id="tong_thanh_tien">0</span></div>
    <button class="export" onclick="exportTable()">Xuất ra hình ảnh</button>

    <script>
        let now = new Date();
        let timestamp = now.toLocaleDateString('vi-VN').replace(/\//g, '-') + '_' + now.toLocaleTimeString('vi-VN').replace(/:/g, '-');
        document.title = 'Tính tiền ngày' + timestamp;
        document.querySelector('h1').innerHTML = 'Tính tiền ngày ' + timestamp;
        function calculateRow(element) {
            let row = element.parentElement.parentElement;
            let so_ki = row.querySelector('input[name="so_ki"]').value;
            let gia = row.querySelector('input[name="gia"]').value;
            let thanh_tien = row.querySelector('.thanh_tien');
            let thanh_tien_value = so_ki * gia || 0;
            thanh_tien.innerHTML = formatCurrency(thanh_tien_value);
            thanh_tien.setAttribute('data-value', thanh_tien_value);
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.thanh_tien').forEach(cell => {
                total += parseFloat(cell.getAttribute('data-value')) || 0;
            });
            document.getElementById('tong_thanh_tien').innerHTML = formatCurrency(total);
        }

        function formatCurrency(value) {
            // return value.toLocaleString('vi-VN', { style: 'currency', currency: 'VND', minimumFractionDigits: 0 });
            return value.toString();
        }

        function addRow() {
            let table = document.getElementById('table').getElementsByTagName('tbody')[0];
            let newRow = table.insertRow();
            newRow.innerHTML = `
                <td><button class="delete-row" onclick="deleteRow(this)">-</button></td>
                <td><input type="text" name="loai"></td>
                <td><input type="number" name="so_ki" oninput="calculateRow(this)"></td>
                <td><input type="number" name="gia" oninput="calculateRow(this)"></td>
                <td class="thanh_tien" data-value="0">0</td>
            `;
        }

        function deleteRow(button) {
            let row = button.parentElement.parentElement;
            row.remove();
            calculateTotal();
        }

        function exportTable() {
            html2canvas(document.body).then(canvas => {
                let link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = "tien_" + timestamp + ".png";
                link.click();
            });
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
